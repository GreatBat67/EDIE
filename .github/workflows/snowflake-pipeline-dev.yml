name: "Snowflake Component: Progression Target - dev"
on:
  workflow_call:
    inputs:
      action_type:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  SNOWFLAKE_ACCOUNT: "fiuynfq-op88690"
  SNOWFLAKE_USER: "github_edie_dev_user"
  SNOWFLAKE_ROLE: "ACCOUNTADMIN"
  SNOWFLAKE_WAREHOUSE: "github_cicd_demo_wh"
  SNOWFLAKE_CLI_FEATURES_ENABLE_SNOWFLAKE_PROJECTS: "true"
  SNOWFLAKE_DATABASE: "EDIE_DEVOPS_DB_dev"
  SNOWFLAKE_SCHEMA: "abc"

jobs:
  dev-environment-execution:
    runs-on: ubuntu-latest
    environment: dev 
    steps:
      - uses: actions/checkout@v4

      - if: inputs.action_type == 'plan'
        name: "DCM Plan — Dry-run against DEV target only"
        uses: ./.github/workflows/modules/action-dcm-engine
        with:
          dcm_dir: "dcm_edie"
          dcm_target: "EDIE_DCM_dev"
          action_type: "plan"

      - if: inputs.action_type == 'deploy'
        name: "DCM Deploy — Apply changes to DEV target only"
        uses: ./.github/workflows/modules/action-dcm-engine
        with:
          dcm_dir: "dcm_edie"
          dcm_target: "EDIE_DCM_dev"
          action_type: "deploy"
