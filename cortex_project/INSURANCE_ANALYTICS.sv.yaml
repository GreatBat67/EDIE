        expr: OUTSTANDING_BALANCE
        data_type: NUMBER
      - name: LATE_FEE
        expr: LATE_FEE
        data_type: NUMBER
  - name: AT_RISK_POLICIES
    description: At-risk policy snapshot with churn probability, revenue exposure,
      NPS, and recommended retention actions
    base_table:
      database: INSURANCE_AI_HUB
      schema: ANALYTICS
      table: AT_RISK_POLICIES
    primary_key:
      columns:
        - CUSTOMER_ID
        - RISK_ID
    dimensions:
      - name: RISK_ID
        expr: RISK_ID
        data_type: VARCHAR
      - name: POLICY_ID
        expr: POLICY_ID
        data_type: VARCHAR
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        data_type: VARCHAR
      - name: RISK_CATEGORY
        expr: RISK_CATEGORY
        data_type: VARCHAR
      - name: DAYS_UNTIL_RENEWAL
        expr: DAYS_UNTIL_RENEWAL
        data_type: NUMBER
      - name: MISSED_PAYMENTS_COUNT
        expr: MISSED_PAYMENTS_COUNT
        data_type: NUMBER
      - name: CLAIM_FREQUENCY
        expr: CLAIM_FREQUENCY
        data_type: NUMBER
      - name: NPS_SCORE
        expr: NPS_SCORE
        data_type: NUMBER
      - name: RETENTION_ACTION
        expr: RETENTION_ACTION
        data_type: VARCHAR
    time_dimensions:
      - name: LAST_CONTACT_DATE
        expr: LAST_CONTACT_DATE
        data_type: DATE
      - name: SNAPSHOT_DATE
        expr: SNAPSHOT_DATE
        data_type: DATE
    facts:
