name: INSURANCE_ANALYTICS
description: Insurance analytics semantic view covering customers, agents, policies,
  claims, billing, and retention risk for the E.D.I.E. platform. Supports Customer
  360, claims intelligence, billing analytics, and churn/risk management use cases.
tables:
  - name: CUSTOMERS
    description: Customer profiles with demographics, contact info, risk tier, credit
      score, and segmentation
    base_table:
      database: INSURANCE_AI_HUB
      schema: ANALYTICS
      table: CUSTOMERS
    primary_key:
      columns:
        - CUSTOMER_ID
    dimensions:
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        data_type: VARCHAR
      - name: FIRST_NAME
        expr: FIRST_NAME
        data_type: VARCHAR
      - name: LAST_NAME
        expr: LAST_NAME
        data_type: VARCHAR
      - name: GENDER
        expr: GENDER
        data_type: VARCHAR
      - name: EMAIL
        expr: EMAIL
        data_type: VARCHAR
      - name: PHONE
        expr: PHONE
        data_type: VARCHAR
      - name: CITY
        expr: CITY
        data_type: VARCHAR
      - name: STATE
        expr: STATE
        data_type: VARCHAR
      - name: ZIP_CODE
        expr: ZIP_CODE
        data_type: VARCHAR
      - name: RISK_TIER
        expr: RISK_TIER
        data_type: VARCHAR
      - name: CREDIT_SCORE
        expr: CREDIT_SCORE
        data_type: NUMBER
      - name: SEGMENT
        expr: SEGMENT
        data_type: VARCHAR
    time_dimensions:
      - name: DATE_OF_BIRTH
        expr: DATE_OF_BIRTH
        data_type: DATE
      - name: CUSTOMER_SINCE
        expr: CUSTOMER_SINCE
        data_type: DATE
  - name: AGENTS
    description: Insurance agents with region, specialization, license, performance
      rating, and active policy counts
    base_table:
      database: INSURANCE_AI_HUB
      schema: ANALYTICS
      table: AGENTS
    primary_key:
      columns:
        - AGENT_ID
    dimensions:
      - name: AGENT_ID
        expr: AGENT_ID
        data_type: VARCHAR
      - name: AGENT_NAME
        expr: AGENT_NAME
        data_type: VARCHAR
      - name: REGION
        expr: REGION
        data_type: VARCHAR
      - name: STATE
        expr: STATE
        data_type: VARCHAR
      - name: SPECIALIZATION
        expr: SPECIALIZATION
        data_type: VARCHAR
      - name: ACTIVE_POLICIES_COUNT
        expr: ACTIVE_POLICIES_COUNT
        data_type: NUMBER
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
    time_dimensions:
      - name: HIRE_DATE
        expr: HIRE_DATE
        data_type: DATE
    facts:
      - name: PERFORMANCE_RATING
        expr: PERFORMANCE_RATING
        data_type: NUMBER
  - name: POLICIES
    description: Insurance policies with type, tier, premium, coverage, deductible,
