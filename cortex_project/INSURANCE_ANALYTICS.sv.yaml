relationships:
  - name: AT_RISK_POLICIES_TO_POLICIES
    left_table: AT_RISK_POLICIES
    right_table: POLICIES
    join_type: inner
    relationship_type: one_to_one
    relationship_columns:
      - left_column: POLICY_ID
        right_column: POLICY_ID
  - name: CLAIMS_TO_POLICIES
    left_table: CLAIMS
    right_table: POLICIES
    join_type: inner
    relationship_type: one_to_one
    relationship_columns:
      - left_column: POLICY_ID
        right_column: POLICY_ID
  - name: POLICIES_TO_AGENTS
    left_table: POLICIES
    right_table: AGENTS
    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: AGENT_ID
        right_column: AGENT_ID
verified_queries:
  - name: 0;1
    question: What is the total premium revenue by policy type?
    sql: SELECT p.POLICY_TYPE, COUNT(*) AS policy_count, SUM(p.PREMIUM_AMOUNT) AS
      total_premium FROM policies AS p GROUP BY p.POLICY_TYPE
    verified_at: 1787828648
    verified_by: Semantic Model Generator
  - name: 1;1
    question: What is the total claims amount, claim count, and average fraud score
      by region?
    sql: SELECT a.REGION, COUNT(cl.CLAIM_ID) AS claim_count, SUM(cl.CLAIM_AMOUNT)
      AS total_claimed, AVG(cl.FRAUD_SCORE) AS avg_fraud_score FROM claims AS cl JOIN
      policies AS p ON cl.POLICY_ID = p.POLICY_ID JOIN agents AS a ON p.AGENT_ID =
      a.AGENT_ID GROUP BY a.REGION
    verified_at: 1787828648
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What is the total revenue at risk and policy distribution by risk category?
    sql: SELECT ar.RISK_CATEGORY, COUNT(*) AS at_risk_count, SUM(ar.REVENUE_AT_RISK)
      AS total_revenue_at_risk, AVG(ar.CHURN_PROBABILITY) AS avg_churn FROM at_risk_policies
      AS ar GROUP BY ar.RISK_CATEGORY
    verified_at: 1787828648
    verified_by: Semantic Model Generator
  - name: 3;1
    question: What is the outstanding balance by payment status?
    sql: SELECT b.PAYMENT_STATUS, COUNT(*) AS invoice_count, SUM(b.OUTSTANDING_BALANCE)
      AS total_outstanding FROM billing AS b GROUP BY b.PAYMENT_STATUS
    verified_at: 1787828648
    verified_by: Semantic Model Generator
  - name: 4;1
    question: Which policy types and regions have the highest revenue at risk from
      churning policies?
    sql: SELECT p.POLICY_TYPE, a.REGION, COUNT(DISTINCT ar.POLICY_ID) AS at_risk_policies,
      SUM(ar.REVENUE_AT_RISK) AS revenue_at_risk FROM at_risk_policies AS ar JOIN
      policies AS p ON ar.POLICY_ID = p.POLICY_ID JOIN agents AS a ON p.AGENT_ID =
      a.AGENT_ID GROUP BY p.POLICY_TYPE, a.REGION ORDER BY revenue_at_risk DESC
    verified_at: 1787828648
    verified_by: Semantic Model Generator
