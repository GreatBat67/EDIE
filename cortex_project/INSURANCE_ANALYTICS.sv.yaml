    dimensions:
      - name: POLICY_ID
        expr: POLICY_ID
        data_type: VARCHAR
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        data_type: VARCHAR
      - name: AGENT_ID
        expr: AGENT_ID
        data_type: VARCHAR
      - name: POLICY_TYPE
        expr: POLICY_TYPE
        data_type: VARCHAR
      - name: PLAN_TIER
        expr: PLAN_TIER
        data_type: VARCHAR
      - name: STATUS
        expr: STATUS
