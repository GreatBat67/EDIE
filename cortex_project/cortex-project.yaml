version: 1
artifacts:
  - path: INSURANCE_ANALYTICS.sv.yaml
    type: semantic_view
    targets:
      default:
        object: INSURANCE_AI_HUB.ANALYTICS.INSURANCE_ANALYTICS
  - path: EDIE_ANALYTICS_AGENT.agent.yaml
    type: cortex_agent
    targets:
      default:
        object: INSURANCE_AI_HUB.ANALYTICS.EDIE_ANALYTICS_AGENT
  - path: EDIE_DOCUMENT_AGENT.agent.yaml
    type: cortex_agent
    targets:
      default:
        object: INSURANCE_AI_HUB.DOCUMENTS.EDIE_DOCUMENT_AGENT
  - path: EDIE_DQ_AGENT.agent.yaml
    type: cortex_agent
    targets:
      default:
        object: INSURANCE_AI_HUB.DATA_QUALITY.EDIE_DQ_AGENT
  - path: EDIE.agent.yaml
    type: cortex_agent
    targets:
      default:
        object: INSURANCE_AI_HUB.PUBLIC.EDIE
  - path: DATA_QUALITY_ANALYTICS.sv.yaml
    type: semantic_view
    targets:
      default:
        object: INSURANCE_AI_HUB.DATA_QUALITY.DATA_QUALITY_ANALYTICS
